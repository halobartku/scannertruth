name: verify

# Runs the whole self-checking surface on every push and every pull request, and once a week
# so rot shows up without anyone pushing.
#
# This exists because until 2026-08-31 nobody outside this project had reproduced any number in
# it. Our credibility rested entirely on self-report, which is the exact thing the benchmark
# criticises vendors for. A green badge is not independent verification either, but it means a
# stranger can see the checks run on a machine we do not control, and can read what they assert.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  selfcheck:
    # Three operating systems, because "it is pure standard library so it is portable" is an
    # assertion and this repository does not publish assertions. The verification surface is
    # what a stranger runs to check our numbers, so it has to run where they are, not where we
    # are. Windows earns its place: paths are the one thing a scorer can get quietly wrong, and
    # a finding located by a backslash path must map to the same case as a forward-slash one.
    # 3.9 is the floor and 3.12 the ceiling, so a version drift shows up here rather than in
    # somebody's terminal.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test suite
        run: python test_all.py

      - name: Scorer self-checks, including the positive control
        run: |
          python tools/score.py --demo
          python tools/score2.py --demo
          python tools/build_corpus2.py --demo
          python tools/unmapped_check.py --demo
          python tools/corpus_ghsa.py --demo

      # NOTE: verify.py checks RESULTS.md only - run 1, sol-audit v1, 2/11 nominal and 0/11
      # real. It does NOT check the six-scanner table in RESULTS-all.md, and the step used to be
      # labelled as though it did. Nothing currently re-derives the current headline from raw
      # data; that is recorded as a gap rather than papered over with a broad step name.
      - name: Run-1 result reproduces from its raw data (NOT the current headline)
        run: python tools/verify.py

      - name: Calibration controls on corpus 2 must score zero
        run: python tools/control_c2.py

      - name: No scanner may score a detection under an unmapped rule unnoticed
        run: |
          python tools/unmapped_check.py --findings raw/c2-radar-complete.json --kind sol-audit
          python tools/unmapped_check.py --findings raw/c2-vaultlint-complete.json --kind sol-audit
          python tools/unmapped_check.py --findings raw/c2-sol-audit.json --kind sol-audit
